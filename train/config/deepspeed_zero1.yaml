compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  deepspeed_multinode_launcher: standard
  offload_optimizer_device: none
  pin_memory: true
  offload_param_device: none
  zero_stage: 1
  overlap_comm: true 
  contiguous_gradients: true
  allgather_partitions: true
  allgather_bucket_size: 10e8
  reduce_scatter: true
  reduce_bucket_size: 10e8
distributed_type: DEEPSPEED
downcast_bf16: 'no'
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 6
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false